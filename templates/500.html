{% extends "base.html" %}

{% block title %}Internal Server Error (500) — TravelAI Companion{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card shadow-sm p-5 mx-auto max-w-600">
        <div class="card-body">
            <i class="bi bi-exclamation-octagon text-danger fs-1 d-block mb-3"></i>
            <h1 class="display-4 fw-bold text-dark mb-2">500</h1>
            <h4 class="fw-bold mb-3">Unexpected Application Error</h4>
            <p class="text-muted mb-4">Something went wrong on our server. The database transaction has been safely rolled back.</p>
            <a href="{{ url_for('index') }}" class="btn btn-primary fw-bold px-4 py-2">
                <i class="bi bi-arrow-counterclockwise me-2"></i>Back to Home
            </a>
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Page Not Found (404) — TravelAI Companion{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card shadow-sm p-5 mx-auto max-w-600">
        <div class="card-body">
            <i class="bi bi-compass text-muted fs-1 d-block mb-3"></i>
            <h1 class="display-4 fw-bold text-dark mb-2">404</h1>
            <h4 class="fw-bold mb-3">Destination Not Found</h4>
            <p class="text-muted mb-4">The route or page you are looking for might have been moved or does not exist.</p>
            <a href="{{ url_for('index') }}" class="btn btn-info text-white fw-bold px-4 py-2">
                <i class="bi bi-house me-2"></i>Return to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
